name: Build and regression tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Regression tests (shared production balance rules)
        run: dotnet run --project Tests/SCP153.Tests.csproj --configuration Release
      - name: Compile plugin against checked-in server references
        run: dotnet build BULISCP.csproj --configuration Release
      - name: Package plugin assets (no server libraries)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item bin/Release/SCP153.dll package/
          Copy-Item Audio package/ -Recurse
          New-Item -ItemType Directory -Path package/Schematics/SCP153 -Force
          Copy-Item Schematic/SCP153.json package/Schematics/SCP153/
          Copy-Item docs, config package/ -Recurse
          Copy-Item README.md, CHANGELOG.md, LICENSE.txt package/
          $packageRoot = (Resolve-Path package).Path
          $checksums = @(Get-ChildItem package -Recurse -File -Exclude SHA256SUMS.txt |
            Get-FileHash -Algorithm SHA256 | ForEach-Object {
              $relativePath = $_.Path.Substring($packageRoot.Length + 1).Replace('\', '/')
              "$($_.Hash.ToLower())  $relativePath"
            })
          $checksums | Out-File package/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: SCP153-2.2.0
          path: package/

  release:
    name: Publish v2.2.0
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[release v2.2.0]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v2.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: SCP153-2.2.0
          path: release-package/
      - name: Verify package and prepare release attachments
        run: python3 build/package_release.py --package release-package --output release-assets --commit "$GITHUB_SHA"
      - name: Create annotated tag at the tested main commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'public override Version Version => new Version(2, 2, 0);' Plugin.cs
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA" || {
              echo "Existing tag points to another commit; refusing to move it."
              exit 1
            }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$RELEASE_TAG" "$GITHUB_SHA" --message "SCP-153 BULSON v2.2.0"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Publish release with Polish and English notes
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/RELEASE_v2.2.0.md"
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "Release is already published for the verified tag."
              exit 0
            fi
            gh release edit "$RELEASE_TAG" --title "SCP-153 BULSON v2.2.0 — poprawki audytu / audit fixes" --notes-file "$notes"
            gh release upload "$RELEASE_TAG" release-assets/SCP153.dll release-assets/SCP153-2.2.0.zip release-assets/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "SCP-153 BULSON v2.2.0 — poprawki audytu / audit fixes" --notes-file "$notes" release-assets/SCP153.dll release-assets/SCP153-2.2.0.zip release-assets/SHA256SUMS.txt
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
